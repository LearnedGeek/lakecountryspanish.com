<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OG Image Template - Lake Country Spanish</title>
    <!--
      Visual reference for the generated og-image.jpg. The actual image is
      produced by the SkiaSharp generator at tmp/og-image/Program.cs (run
      `dotnet run` in that folder, then copy the output over
      wwwroot/img/og-image.jpg). This HTML mirrors the design so anyone
      opening it in a browser can eyeball the layout without needing the
      .NET tooling.
    -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .og-image {
            width: 1200px;
            height: 630px;
            background: #1e3a5f;
            padding: 22px;
            position: relative;
        }
        .photo {
            width: 100%;
            height: 388px;
            border-radius: 24px;
            background-image: url('img/hero-classroom-dance.jpg');
            background-size: cover;
            background-position: center 30%;
        }
        .banner {
            width: 940px;
            height: 198px;
            margin: 0 auto;
            background: #152b48;
            border: 1.5px solid #2d4a6f;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 20px;
            padding-top: 70px;   /* clearance for the overlapping logo */
        }
        .logo {
            position: absolute;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: white url('img/llama-logo-painted.png') center/cover no-repeat;
            border: 5px solid white;
            left: 50%;
            top: calc(22px + 388px);
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .title { font-size: 32px; font-weight: 700; line-height: 1.2; text-align: center; }
        .title .l1 { color: white; display: block; }
        .title .l2 { color: #e85a42; display: block; }
        .tagline { margin-top: 10px; color: #cbd5e1; font-size: 18px; font-weight: 700; }
        .tagline .dot { color: #e85a42; margin: 0 8px; }
        .url { margin-top: 6px; color: #9db4d6; font-size: 18px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="og-image">
        <div class="photo"></div>
        <div class="banner">
            <div class="title">
                <span class="l1">Spanish Language &amp;</span>
                <span class="l2">Cultural Enrichment</span>
            </div>
            <div class="tagline">Language <span class="dot">&bull;</span> Culture <span class="dot">&bull;</span> Community</div>
            <div class="url">lakecountryspanish.com</div>
        </div>
        <div class="logo" aria-label="Lake Country Spanish"></div>
    </div>
</body>
</html>
