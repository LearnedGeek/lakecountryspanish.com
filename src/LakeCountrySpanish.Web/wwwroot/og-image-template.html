<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OG Image Template - Lake Country Spanish</title>
    <!--
      Visual reference for the generated og-image.jpg. The actual image is
      produced by the SkiaSharp generator at tmp/og-image/Program.cs (run
      `dotnet run` in that folder, then copy the output over
      wwwroot/img/og-image.jpg). This HTML mirrors the design so anyone
      opening it in a browser can eyeball the layout without needing the
      .NET tooling.
    -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .og-image {
            width: 1200px;
            height: 630px;
            background: #1e3a5f;
            padding: 22px;
        }
        .card {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 26px;
            overflow: hidden;
            display: grid;
            grid-template-rows: 60% 40%;
            background: #1e3a5f;
        }
        .hero {
            background-image: url('img/hero-classroom-dance.jpg');
            background-size: cover;
            background-position: center 30%;
        }
        .banner {
            background: #1e3a5f;
            display: flex;
            align-items: center;
            padding: 0 40px;
            gap: 32px;
        }
        .logo {
            flex-shrink: 0;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: white url('img/llama-logo-painted.png') center/cover no-repeat;
            border: 5px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .text { flex: 1; }
        .title { font-size: 42px; font-weight: 700; line-height: 1.15; }
        .title .l1 { color: white; display: block; }
        .title .l2 { color: #e85a42; display: block; }
        .tagline { margin-top: 14px; color: #cbd5e1; font-size: 20px; font-weight: 700; }
        .tagline .dot { color: #e85a42; margin: 0 8px; }
        .url { margin-top: 10px; color: #9db4d6; font-size: 20px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="og-image">
        <div class="card">
            <div class="hero"></div>
            <div class="banner">
                <div class="logo" aria-label="Lake Country Spanish"></div>
                <div class="text">
                    <div class="title">
                        <span class="l1">Spanish Language &amp;</span>
                        <span class="l2">Cultural Enrichment</span>
                    </div>
                    <div class="tagline">Language <span class="dot">&bull;</span> Culture <span class="dot">&bull;</span> Community</div>
                    <div class="url">lakecountryspanish.com</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
