# Deploy Lake Country Spanish to the Hetzner VPS (staging environment).
#
# Modeled on the LearnedGeek + Allevo deploy workflows that target the
# same VPS. Atomic tar-over-SSH swap, .prev rollback, smoke test.
#
# Triggers:
#   - Push to main (automatic, after PR merge)
#   - Manual via the Actions tab → "Deploy LCS to Hetzner (stg)" → Run
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY    — Private key authorized on the VPS for the deploy
#                       user. Generate a NEW keypair specifically for LCS:
#                         ssh-keygen -t ed25519 -f ./gh-deploy-lcs -C "github-actions-lcs"
#                       Paste the private key contents into this secret.
#                       Add the matching .pub to the VPS user's
#                       ~/.ssh/authorized_keys. Do not reuse the Allevo or
#                       LearnedGeek keypair — blast radius matters.
#   DEPLOY_HOST       — VPS hostname or IP, e.g. 5.161.205.21.
#   DEPLOY_USER       — SSH user. root for now; switch to a dedicated
#                       deploy user later (see hardening note at bottom).
#   STG_PG_PASSWORD   — Password for the lakecountryspanish_stg Postgres
#                       role. Set during initial provisioning. Mirrors the
#                       PROD_PG_PASSWORD secret used by deploy-prod.yml.
#   CLAUDE_API_KEY    — Anthropic API key the curriculum drafter calls
#                       through Claude:ApiKey config.
#   PIXABAY_API_KEY   — Pixabay search API key used by the media library.

name: Deploy LCS to Hetzner (stg)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Prevent concurrent deploys from racing each other on the same paths.
concurrency:
  group: deploy-hetzner-lcs-stg
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore + build + test
        # The 5 pre-existing Stripe integration tests need a real Stripe
        # test key configured in the runner; until that's wired in via
        # secrets, filter them out so deploys don't fail on known gaps.
        # The solution lives under src/ — restore/build at that path.
        run: |
          dotnet restore src/LakeCountrySpanish.sln
          dotnet build src/LakeCountrySpanish.sln --no-restore --configuration Release
          dotnet test src/LakeCountrySpanish.Tests --no-build --configuration Release --filter "FullyQualifiedName!~StripeE2ETests"

      - name: Publish (linux-x64, framework-dependent)
        run: |
          # Publish does its own restore — needed for the linux-x64 RID-
          # specific assets even though we already restored above. Matches
          # the workaround used in the Allevo + LearnedGeek workflows.
          dotnet publish src/LakeCountrySpanish.Web/LakeCountrySpanish.Web.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            --output ./publish

      - name: Render appsettings.Production.json from template + secrets
        env:
          PG_PASSWORD: ${{ secrets.STG_PG_PASSWORD }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STG_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STG_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STG_STRIPE_WEBHOOK_SECRET }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          SCHEDULED_TASKS_SECRET_KEY: ${{ secrets.STG_SCHEDULED_TASKS_SECRET_KEY }}
          PG_DATABASE: lakecountryspanish_stg
          PG_USERNAME: lakecountryspanish_stg
          SITE_NAME: "Lake Country Spanish (stg)"
          BASE_URL: "https://stg.lakecountryspanish.com"
          DATAPROTECTION_KEYS_DIR: "/var/lib/lakecountryspanish-stg-data/keys"
        run: |
          # Restrict envsubst to the explicit variable list so any other
          # ${...} pattern in the template is left literal — defensive
          # against future copy-paste mistakes.
          VARS='${PG_PASSWORD} ${CLAUDE_API_KEY} ${PIXABAY_API_KEY} ${SMTP_PASSWORD} ${STRIPE_PUBLISHABLE_KEY} ${STRIPE_SECRET_KEY} ${STRIPE_WEBHOOK_SECRET} ${RECAPTCHA_SITE_KEY} ${RECAPTCHA_SECRET_KEY} ${SCHEDULED_TASKS_SECRET_KEY} ${PG_DATABASE} ${PG_USERNAME} ${SITE_NAME} ${BASE_URL} ${DATAPROTECTION_KEYS_DIR}'
          envsubst "$VARS" \
            < src/LakeCountrySpanish.Web/appsettings.Production.json.template \
            > publish/appsettings.Production.json
          # Sanity check: file must parse as JSON. Catches secrets with
          # characters that break JSON escaping (quote, backslash) before
          # we ship a broken config.
          python3 -m json.tool publish/appsettings.Production.json > /dev/null

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the VPS host key. If the VPS identity ever changes
          # (rebuild, IP migration) this deploy will fail loudly rather
          # than silently trust a new host.
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via tar-over-SSH (atomic swap)
        run: |
          # Stream tar over SSH, extract into a staging directory first.
          # Only after the extraction succeeds do we stop the service and
          # swap directories atomically. If anything fails mid-transfer,
          # the active site is untouched. Previous version is kept at
          # /var/www/lakecountryspanish-stg.prev so manual rollback is one
          # `mv` away.
          #
          # User-uploaded assets (hero images, future document uploads)
          # live outside the deploy directory at
          # /var/lib/lakecountryspanish-stg-data/ so they survive deploys —
          # matches the /var/lib/{app-slug}-data/ convention used by
          # learnedgeek-data (byco.json, huntapp.json) and dani-data (audio
          # cache) on this same VPS. Deploys blow away wwwroot each time,
          # which would otherwise wipe every upload. On each deploy we
          # replace the deployed wwwroot/img/programs with a symlink to
          # the persistent dir, first seeding any git-tracked defaults
          # (--ignore-existing so user uploads win over seeds).
          cd publish
          tar -cf - . | ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             STAGING=/var/www/lakecountryspanish-stg.new
             ACTIVE=/var/www/lakecountryspanish-stg
             PREV=/var/www/lakecountryspanish-stg.prev
             UPLOADS=/var/lib/lakecountryspanish-stg-data/img/programs
             KEYS=/var/lib/lakecountryspanish-stg-data/keys
             rm -rf "$STAGING"
             mkdir -p "$STAGING"
             cd "$STAGING"
             tar -xf -
             # DataProtection keys directory — must exist and be www-data
             # owned so cookies + antiforgery tokens survive restarts.
             # 0700 restricts read to www-data only (keys are secrets).
             install -d -o www-data -g www-data -m 700 "$KEYS"
             # Ensure persistent uploads dir exists (idempotent) and rescue
             # any existing user uploads that live in the currently-active
             # wwwroot from prior deploys so they graduate to the persistent
             # location before we symlink.
             mkdir -p "$UPLOADS"
             if [ -d "$ACTIVE/wwwroot/img/programs" ] && [ ! -L "$ACTIVE/wwwroot/img/programs" ]; then
               rsync -a --ignore-existing "$ACTIVE/wwwroot/img/programs/" "$UPLOADS/"
             fi
             # Seed the persistent dir with any git-tracked defaults the
             # deploy brings, without overwriting existing (potentially
             # user-uploaded) files. Guarded — the directory only exists
             # in the publish output when there are git-tracked files
             # under wwwroot/img/programs/.
             if [ -d "$STAGING/wwwroot/img/programs" ]; then
               rsync -a --ignore-existing "$STAGING/wwwroot/img/programs/" "$UPLOADS/"
             fi
             # Replace the deployed folder with a symlink to persistent uploads.
             # Ensure the parent dir exists (wwwroot/img may not be in the
             # publish output when no other files live there).
             mkdir -p "$STAGING/wwwroot/img"
             rm -rf "$STAGING/wwwroot/img/programs"
             ln -s "$UPLOADS" "$STAGING/wwwroot/img/programs"
             chown -R www-data:www-data "$UPLOADS"
             # Service runs as www-data. Set ownership before the swap so
             # the service can read its appsettings.Production.json and
             # write DataProtection keys. Preserve the symlink (chown -h).
             chown -R www-data:www-data "$STAGING"
             chown -h www-data:www-data "$STAGING/wwwroot/img/programs"
             # appsettings.Production.json carries secrets — restrict
             # readability to www-data only.
             chmod 600 "$STAGING/appsettings.Production.json"
             systemctl stop lakecountryspanish-stg
             if [ -d "$ACTIVE" ]; then
               rm -rf "$PREV"
               mv "$ACTIVE" "$PREV"
             fi
             mv "$STAGING" "$ACTIVE"
             systemctl start lakecountryspanish-stg'

      - name: Smoke test the deploy
        run: |
          # Poll the public URL up to ~30 seconds for a 2xx/3xx response.
          # If the service comes up fast we exit immediately; if it's slow
          # we still wait long enough.
          URL="https://stg.lakecountryspanish.com"
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [[ "$STATUS" -ge 200 && "$STATUS" -lt 400 ]]; then
              echo "$URL responded with HTTP $STATUS after attempt ${i}"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 2s"
            sleep 2
          done
          echo "Health check failed: no 2xx/3xx response in 30 seconds"
          exit 1

# --- Hardening to do later -------------------------------------------------
#
# 1) Dedicated deploy user on the VPS instead of root. Same approach as
#    documented in the LearnedGeek + Allevo deploy workflows.
#
# 2) Microsoft Teams (or other) notification on deploy failure or success.
#
# 3) Tag-gated production deploys: when prod migrates to Hetzner, add a
#    sibling deploy-prod.yml that triggers only on git tags matching v*.
#
# 4) Rollback script wrapping the .prev swap:
#       systemctl stop lakecountryspanish-stg
#       rm -rf /var/www/lakecountryspanish-stg
#       mv /var/www/lakecountryspanish-stg.prev /var/www/lakecountryspanish-stg
#       systemctl start lakecountryspanish-stg
#
# 5) Stripe integration tests: once a stripe-test-key GitHub secret is
#    wired in, drop the --filter "FullyQualifiedName!~StripeE2ETests"
#    so the deploy runs the full suite.
